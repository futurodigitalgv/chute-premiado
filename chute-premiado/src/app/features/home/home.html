<header>
  <nav class="navbar nav-bar-cor">
    <div class="container-fluid">
      <!-- Logo -->
      <a class="navbar-brand" href="#">
        <img class="logo-chute" src="assets/img/logo.png" alt="Logo Chute Certeiro" />
      </a>

      <!-- Lado direito: botões de login/cadastro ou perfil do usuário -->
      <div class="right-side">
        <!-- Botões quando não logado -->
        <div *ngIf="!isLoggedIn">
          <button type="button" class="btn-acao btn-login" (click)="goToLogin()">
            <i class="bi bi-box-arrow-in-right"></i>
            ENTRAR
          </button>
          
          <button type="button" class="btn-acao btn-register" (click)="goToRegister()">
            <i class="bi bi-person-plus"></i>
            CADASTRAR
          </button>
        </div>

        <!-- Perfil quando logado -->
        <div *ngIf="isLoggedIn" class="user-profile">
          <div class="user-info">
            <div class="perfil">
              <img class="avatar" src="assets/img/logo.png" [alt]="userName" />
              <div class="user-details">
                <span class="nome">{{ userName }}</span>
                <span class="credits">{{ formatCurrency(userCredits) }}</span>
              </div>
            </div>
            
            <button type="button" class="btn-acao btn-credits" (click)="goToCredits()">
              <i class="bi bi-plus-circle"></i>
              INSERIR CRÉDITO
            </button>
            
            <button type="button" class="btn-logout" (click)="logout()">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>
<main>
<section class="carousel-hero">
  <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="assets/img/banner.png" class="d-block w-100" alt="Banner 1">
      </div>
      <div class="carousel-item">
        <img src="assets/img/banner2.png" class="d-block w-100" alt="Banner 2">
      </div>
      <div class="carousel-item">
        <img src="assets/img/banner.png" class="d-block w-100" alt="Banner 3">
      </div>
    </div>

    <button class="carousel-control-prev" type="button"
            data-bs-target="#heroCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Anterior</span>
    </button>
    <button class="carousel-control-next" type="button"
            data-bs-target="#heroCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Próximo</span>
    </button>
  </div>
</section>
 <section class="conteudo-bg">
    <div class="container">
      <section class="matches-section">
  <div class="cards-grid">
    <div class="match-card" *ngFor="let jogo of jogos">
      <div class="match-header">
        <div class="team">
          <img class="team-logo" [src]="jogo.casaLogo" [alt]="jogo.casaNome">
        </div>

        <div class="versus">X</div>

        <div class="team">
          <img class="team-logo" [src]="jogo.foraLogo" [alt]="jogo.foraNome">
        </div>
      </div>

      <div class="match-info">
        <div class="match-title">{{ jogo.casaNome }} x {{ jogo.foraNome }}</div>
        <div class="match-date">{{ jogo.data | date:'dd/MM/yyyy · HH:mm' }}</div>
      </div>

      <button class="btn-bolao" (click)="openBetModal(jogo)" style="pointer-events: auto; z-index: 10; position: relative;">FAZER BOLÃO</button>
    </div>
  </div>
</section>
    </div>
  </section>
</main>

<!-- Modal de Apostas Simples -->
<div *ngIf="showBetModal" class="modal-overlay" (click)="closeBetModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    
    <h2>Fazer Aposta</h2>
    
    <div *ngIf="selectedJogo">
      <h3>{{ selectedJogo.casaNome }} x {{ selectedJogo.foraNome }}</h3>
      <p>{{ selectedJogo.data | date:'dd/MM/yyyy · HH:mm' }}</p>
    </div>
    
    <div>
      <label>Seu Palpite:</label>
      <div class="score-inputs">
        <input type="number" [(ngModel)]="placarCasa" placeholder="Casa">
        <span>X</span>
        <input type="number" [(ngModel)]="placarFora" placeholder="Fora">
      </div>
    </div>
    
    <div>
      <label>Valor da Aposta:</label>
      <input type="number" [(ngModel)]="valorAposta" placeholder="R$">
    </div>
    
    <div class="modal-buttons">
      <button (click)="fazerAposta()">Apostar</button>
      <button (click)="closeBetModal()">Cancelar</button>
    </div>
    
  </div>
</div>
