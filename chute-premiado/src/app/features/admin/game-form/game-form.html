<div class="modal-overlay" (click)="closeForm()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ isEditing ? 'Editar Jogo' : 'Criar Novo Jogo' }}</h3>
      <button type="button" class="btn-close" (click)="closeForm()">
        <i class="bi bi-x"></i>
      </button>
    </div>

    <form (ngSubmit)="onSubmit()" class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label for="casaNome">Nome do Time Casa:</label>
          <input 
            type="text" 
            id="casaNome" 
            [(ngModel)]="formData.casaNome" 
            name="casaNome"
            class="form-control"
            placeholder="Ex: Flamengo"
            required
          />
        </div>

        <div class="form-group">
          <label for="foraNome">Nome do Time Visitante:</label>
          <input 
            type="text" 
            id="foraNome" 
            [(ngModel)]="formData.foraNome" 
            name="foraNome"
            class="form-control"
            placeholder="Ex: Palmeiras"
            required
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="casaLogo">Escudo Time Casa:</label>
          <input 
            type="file" 
            id="casaLogo" 
            accept="image/*"
            (change)="onFileChange($event, 'casa')"
            class="form-control file-input"
          />
          <div class="file-preview" *ngIf="formData.casaLogo">
            <img [src]="formData.casaLogo" alt="Preview" class="preview-image">
          </div>
        </div>

        <div class="form-group">
          <label for="foraLogo">Escudo Time Visitante:</label>
          <input 
            type="file" 
            id="foraLogo" 
            accept="image/*"
            (change)="onFileChange($event, 'fora')"
            class="form-control file-input"
          />
          <div class="file-preview" *ngIf="formData.foraLogo">
            <img [src]="formData.foraLogo" alt="Preview" class="preview-image">
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="data">Data e Horário da Partida:</label>
          <input 
            type="datetime-local" 
            id="data" 
            [(ngModel)]="formData.data" 
            name="data"
            class="form-control"
            required
          />
        </div>

        <div class="form-group">
          <label for="horarioEncerramento">Horário de Encerramento das Apostas:</label>
          <input 
            type="datetime-local" 
            id="horarioEncerramento" 
            [(ngModel)]="formData.horarioEncerramento" 
            name="horarioEncerramento"
            class="form-control"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="valorAposta">Valor da Aposta (R$):</label>
        <input 
          type="number" 
          id="valorAposta" 
          [(ngModel)]="formData.valorAposta" 
          name="valorAposta"
          class="form-control"
          min="0.01"
          step="0.01"
          placeholder="10.00"
          required
        />
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="modal-footer">
        <button 
          type="button" 
          class="btn-cancel"
          (click)="closeForm()"
        >
          Cancelar
        </button>
        <button 
          type="submit" 
          class="btn-save"
          [disabled]="isLoading"
        >
          <span *ngIf="isLoading">Salvando...</span>
          <span *ngIf="!isLoading">{{ isEditing ? 'Atualizar' : 'Criar' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
